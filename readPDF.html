<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPC (PDF) → raw do fluxograma</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8; --pri:#3b82f6; --warn:#f59e0b; --ok:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:20px; }
    main { max-width: 900px; margin: 0 auto; display:grid; gap:14px; }
    h1 { font-size: 20px; margin: 0; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .note { color:var(--mut); font-size:13px; }
    #drop { border:2px dashed var(--line); border-radius:12px; padding:28px; text-align:center; cursor:pointer; }
    #drop.over { border-color:var(--pri); background:#3b82f622; }
    .opts { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; }
    label { display:grid; gap:4px; font-size:13px; color:var(--mut); }
    input[type=text], input[type=number] { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
    label.inl { display:flex; align-items:center; gap:6px; }
    button { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
    button.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    textarea, pre { width:100%; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.5 ui-monospace, Consolas, monospace; }
    textarea { min-height: 320px; resize: vertical; }
    pre { max-height: 260px; overflow:auto; margin:8px 0 0; white-space: pre-wrap; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    #avisos { margin:0; padding-left:18px; color:var(--warn); font-size:13px; }
    #status { font-size:13px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>📄 PPC (PDF) → <code>"raw"</code> do fluxograma</h1>

  <section class="panel">
    <div id="drop" tabindex="0" role="button" aria-label="Escolher o PDF do PPC">
      Arraste o PDF do PPC aqui ou <b>clique para escolher</b>
      <div class="note" style="margin-top:6px">O arquivo é lido no seu navegador e não é enviado para nenhum servidor.</div>
    </div>
    <input type="file" id="file" accept="application/pdf" hidden>

    <div class="opts">
      <label>Códigos de extensão (prefixos, separados por vírgula)
        <input type="text" id="optExt" value="EXT,PRI" size="22">
      </label>
      <label>Semestre das optativas
        <input type="number" id="optSem" value="10" min="1" max="20" style="width:90px">
      </label>
      <label class="inl" style="align-self:end"><input type="checkbox" id="optOrdem"> manter a ordem do PDF</label>
    </div>
    <div id="status" class="note" style="margin-top:10px" role="status"></div>
  </section>

  <section class="panel" id="result" hidden>
    <ul id="avisos"></ul>
    <textarea id="out" spellcheck="false" aria-label="Resultado"></textarea>
    <div class="bar">
      <button class="pri" id="btnCopy">Copiar</button>
      <button id="btnDown">Baixar .json</button>
      <button id="btnDebug">Ver texto lido do PDF</button>
    </div>
    <pre id="debug" hidden></pre>
  </section>
</main>

<!-- pdf.js (versão fixa). Se o CDN estiver bloqueado, baixe os dois arquivos e aponte para eles. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
  import { extractLines, linhasParaDisciplinas, buildRaw, formatRaw } from "./readPDF.js";

  const $ = id => document.getElementById(id);
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let ultimoBuffer = null;
  let ultimasLinhas = [];

  async function processar() {
    if (!ultimoBuffer) return;
    $("status").textContent = "Lendo o PDF…";
    try {
      if (!ultimasLinhas.length) ultimasLinhas = await extractLines(pdfjsLib, ultimoBuffer.slice(0));
      const discs = linhasParaDisciplinas(ultimasLinhas);
      if (!discs.length) {
        throw new Error("Nenhuma disciplina encontrada. Veja o texto lido do PDF para entender o formato.");
      }
      const { raw, avisos } = buildRaw(discs, {
        extCodes: $("optExt").value.split(",").map(s => s.trim()).filter(Boolean),
        semOptativa: +$("optSem").value || 10,
        manterOrdem: $("optOrdem").checked
      });
      $("out").value = formatRaw(raw);
      $("avisos").innerHTML = "";
      avisos.forEach(a => { const li = document.createElement("li"); li.textContent = a; $("avisos").appendChild(li); });
      $("debug").textContent = ultimasLinhas.map(l => `p${l.page}  ` + l.cells.map(c => c.text).join("  |  ")).join("\n");
      $("result").hidden = false;
      $("status").textContent = `✓ ${raw.length} disciplinas encontradas` + (avisos.length ? ` · ${avisos.length} aviso(s)` : "");
    } catch (err) {
      $("status").textContent = "⚠️ " + err.message;
      if (ultimasLinhas.length) {
        $("debug").textContent = ultimasLinhas.map(l => `p${l.page}  ` + l.cells.map(c => c.text).join("  |  ")).join("\n");
        $("result").hidden = false;
        $("out").value = "";
        $("avisos").innerHTML = "";
      }
    }
  }

  async function carregar(file) {
    if (!file || !/pdf$/i.test(file.type || file.name)) {
      $("status").textContent = "⚠️ Escolha um arquivo PDF.";
      return;
    }
    ultimoBuffer = await file.arrayBuffer();
    ultimasLinhas = [];
    await processar();
  }

  const drop = $("drop");
  drop.onclick = () => $("file").click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
  $("file").onchange = e => carregar(e.target.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); carregar(e.dataTransfer.files[0]); };

  ["optExt", "optSem", "optOrdem"].forEach(id => { $(id).onchange = processar; });

  $("btnCopy").onclick = async () => {
    try {
      await navigator.clipboard.writeText($("out").value);
      $("status").textContent = "✓ Copiado!";
    } catch {
      $("out").select();
      $("status").textContent = "Selecione e copie com Ctrl+C.";
    }
  };
  $("btnDown").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([$("out").value], { type: "application/json" }));
    a.download = "raw.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $("btnDebug").onclick = () => { $("debug").hidden = !$("debug").hidden; };
</script>
</body>
</html>
